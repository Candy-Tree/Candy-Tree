name: Refresh Terminal Profile Snapshot

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: terminal-profile-${{ github.ref }}
  cancel-in-progress: true

env:
  PROFILE_USER: Candy-Tree
  CACHE_SECONDS: "21600"
  STATS_BASE_URL: https://github-readme-stats-8c11-kangseokjoos-projects.vercel.app

jobs:
  updateProfile:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh terminal profile fields
        run: |
          set -euo pipefail

          STATS_FILE="${RUNNER_TEMP:-/tmp}/profile-stats.svg"
          PROFILE_FILE="${RUNNER_TEMP:-/tmp}/github-profile.json"
          CACHE_BUST="${{ github.run_number }}"
          STATS_URL="${STATS_BASE_URL}/api?username=${PROFILE_USER}&hide=stars,issues&include_all_commits=true&show_icons=true&locale=en&cache_seconds=${CACHE_SECONDS}&v=${CACHE_BUST}"
          PROFILE_URL="https://api.github.com/users/${PROFILE_USER}"

          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 "$STATS_URL" -o "$STATS_FILE"

          if [ ! -s "$STATS_FILE" ] || grep -Eiq "Something went wrong|Could not resolve|Can't fetch any contribution|Could not find a user|Error lable|Error label" "$STATS_FILE"; then
            echo "Error: GitHub stats provider returned an invalid SVG"
            exit 1
          fi

          STATS_DESC="$(sed -nE 's#.*<desc[^>]*>(.*)</desc>.*#\1#p' "$STATS_FILE" | head -n 1)"
          TOTAL_COMMITS="$(printf '%s\n' "$STATS_DESC" | sed -nE 's/.*Total Commits[[:space:]]*:[[:space:]]*([0-9,]+).*/\1/p')"
          TOTAL_PRS="$(printf '%s\n' "$STATS_DESC" | sed -nE 's/.*Total PRs[[:space:]]*:[[:space:]]*([0-9,]+).*/\1/p')"
          CONTRIBUTED_TO="$(printf '%s\n' "$STATS_DESC" | sed -nE 's/.*Contributed to \(last year\)[[:space:]]*:[[:space:]]*([0-9,]+).*/\1/p')"

          for value in "$TOTAL_COMMITS" "$TOTAL_PRS" "$CONTRIBUTED_TO"; do
            if [[ ! "$value" =~ ^[0-9][0-9,]*$ ]]; then
              echo "Error: could not parse a GitHub stats value"
              exit 1
            fi
          done

          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 \
            -H "Accept: application/vnd.github+json" \
            "$PROFILE_URL" -o "$PROFILE_FILE"

          PUBLIC_REPOS="$(jq -er '.public_repos | select(type == "number" and . >= 0) | floor' "$PROFILE_FILE")"
          FOLLOWERS="$(jq -er '.followers | select(type == "number" and . >= 0) | floor' "$PROFILE_FILE")"
          FOLLOWING="$(jq -er '.following | select(type == "number" and . >= 0) | floor' "$PROFILE_FILE")"

          for value in "$PUBLIC_REPOS" "$FOLLOWERS" "$FOLLOWING"; do
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "Error: could not parse a public GitHub profile value"
              exit 1
            fi
          done

          PROFILE_PUBLIC_REPOS="$PUBLIC_REPOS" \
          PROFILE_FOLLOWERS="$FOLLOWERS" \
          PROFILE_FOLLOWING="$FOLLOWING" \
          PROFILE_TOTAL_COMMITS="$TOTAL_COMMITS" \
          PROFILE_TOTAL_PRS="$TOTAL_PRS" \
          PROFILE_CONTRIBUTED_TO="$CONTRIBUTED_TO" \
          perl -0pi -e '
            my @fields = (
              ["public.repos", $ENV{PROFILE_PUBLIC_REPOS}],
              ["followers", $ENV{PROFILE_FOLLOWERS}],
              ["following", $ENV{PROFILE_FOLLOWING}],
              ["total.commits", $ENV{PROFILE_TOTAL_COMMITS}],
              ["total.pull-reqs", $ENV{PROFILE_TOTAL_PRS}],
              ["contrib.last-year", $ENV{PROFILE_CONTRIBUTED_TO}],
            );

            for my $field (@fields) {
              my ($label, $value) = @{$field};
              my $updated = s/^(.*?\Q$label\E\s*:\s*).*$/$1$value/m;
              die "Missing terminal profile field: $label\n" unless $updated;
            }
          ' README.md

      - name: Commit refreshed terminal fields
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No terminal profile changes detected"
            exit 0
          fi

          git commit -m "Refresh terminal profile"
          git push
